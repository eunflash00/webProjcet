<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f5f1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="하루결"><title>하루결 · 매일 쌓는 작은 루틴</title>

</head>
<body>
<div class="app">
<header><a class="brand" href="./">하루결<span>DAILY ROUTINE</span></a><div class="header-actions"><button id="install" class="quiet" hidden>앱 설치</button><button id="notify" class="quiet">알림 켜기 <span>↗</span></button></div></header>
<main>
<section class="intro"><div class="eyebrow">A LITTLE BETTER, EVERY DAY</div><h1>작은 실천이 만드는<br> 단단한 하루<span>.</span></h1><p>완벽하지 않아도 괜찮아요. 오늘의 나에게 한 걸음 더.</p></section>
<section class="history-panel" aria-labelledby="history-title"><div class="history-heading"><h2 id="history-title">최근 100일의 발자국</h2><span id="history-summary">3개 이상 완료한 날 0일</span></div><div id="history-grid"></div></section>
<section class="overview"><div><span class="eyebrow">TODAY’S PROGRESS</span><h2><strong id="count">0</strong><span> / 5 완료</span></h2><p id="encourage">오늘의 첫 번째 작은 성취를 만들어 보세요.</p></div><div class="ring" id="ring"><span id="percent">0<small>%</small></span></div></section>
<section class="routine-section"><div class="section-heading"><div><h2>나의 하루 루틴</h2><p id="date-label"></p></div><div class="date-nav"><button id="prev" aria-label="이전 날짜">←</button><input type="date" id="date" aria-label="기록 날짜"><button id="next" aria-label="다음 날짜">→</button><button id="today">오늘</button></div></div><div id="routines"></div></section>
<p class="notice" id="notice" role="status">체크와 시간 설정은 이 브라우저에 저장됩니다. 알림은 앱이 열려 있을 때 동작해요.</p>
</main><footer><span>하루결</span> 오늘도 나만의 속도로.</footer>
</div><div id="toast" role="status" hidden></div>
